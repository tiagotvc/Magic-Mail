ud-v59/validation.txt">Validation</a></nav><img class="phone" id="screen"><script>let mode='day';function show(){document.getElementById('screen').src='previews/postal-hud-v59/'+mode+'-'+document.getElementById('size').value+'.png'}document.getElementById('size').onchange=show;show();</script></main>
