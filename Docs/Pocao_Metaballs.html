<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poção • protótipo metaballs</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111421;color:#eee;font:15px system-ui;display:flex;justify-content:center}main{width:min(100%,560px);padding:20px}h1{font-size:23px;margin:0 0 8px}p{color:#b6bfd2;line-height:1.5}canvas{width:100%;height:65vh;min-height:360px;border-radius:16px;display:block}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{background:#303a55;border:1px solid #53617e;color:white;border-radius:8px;padding:10px 15px;cursor:pointer}label{display:flex;align-items:center;gap:10px;margin:10px 0}input[type=range]{flex:1;accent-color:#bd83ff}small{color:#99a4bd}
</style><main><h1>Poção em movimento</h1><p>Estudo de metaballs: a massa se alonga, forma fios e se divide em gotas. Cada gota continua caindo até sair da tela.</p>
<canvas id="view"></canvas><nav><button id="play">Pausar</button><button id="reset">Recomeçar</button><button data-color=".3,.9,.08">Verde</button><button data-color=".55,.13,.9">Roxa</button><button data-color=".95,.06,.2">Vermelha</button><button data-color=".02,.65,1">Azul</button></nav>
<label>Instante <input id="time" type="range" min="0" max="2.8" step=".001" value="0"><output id="stamp">0 s</output></label>
<label>Velocidade <input id="speed" type="range" min=".15" max="1.5" step=".05" value="1"></label>
<label>Atraso do escoamento <input id="viscosity" type="range" min=".2" max="1.5" step=".05" value=".7"></label>
<small>Protótipo visual isolado. Sem colisões; não altera a animação do jogo. A fusão das gotas é visual, sem conservação física exata de volume.</small></main>
<script>
'use strict';
const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl',{alpha:false});
if(!gl)throw Error('Este navegador não disponibilizou WebGL.');
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const program=gl.createProgram();
gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec2 pos; varying vec2 uv; void main(){uv=pos*.5+.5;gl_Position=vec4(pos,0.,1.);}'));
gl.attachShader(program,shader(gl.FRAGMENT_SHADER,`precision highp float;
varying vec2 uv; uniform vec4 balls[28]; uniform vec3 ink; uniform float aspect;
void main(){vec2 p=(uv-.5)*vec2(7.*aspect,7.);p.y-=1.8;
float field=0.;vec2 grad=vec2(0.);
for(int b=0;b<28;b++){vec2 d=p-balls[b].xy;float r2=balls[b].z*balls[b].z;float f=exp(-2.*dot(d,d)/r2);field+=f;grad+=-4.*d/r2*f;}
float a=smoothstep(.53,.57,field);vec2 n=-grad/max(length(grad),.0001);float light=clamp(dot(n,normalize(vec2(-.6,.8))),0.,1.);
float rim=1.-smoothstep(.55,1.15,field);vec3 liquid=ink*(.65+.35*light);liquid=mix(liquid,mix(ink,vec3(1.),.72),rim*light*.8);liquid+=pow(light,18.)*rim*.65;
float checker=mod(floor(p.x)+floor(p.y)+100.,2.);vec3 bg=mix(vec3(.10,.12,.19),vec3(.13,.16,.24),checker);
gl_FragColor=vec4(mix(bg,liquid,a),1.);}`));
gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const pos=gl.getAttribLocation(program,'pos');gl.enableVertexAttribArray(pos);gl.vertexAttribPointer(pos,2,gl.FLOAT,false,0,0);
const locBalls=gl.getUniformLocation(program,'balls[0]'),locInk=gl.getUniformLocation(program,'ink'),locAspect=gl.getUniformLocation(program,'aspect');
const timeInput=document.querySelector('#time'),speed=document.querySelector('#speed'),viscosity=document.querySelector('#viscosity'),play=document.querySelector('#play');
let time=0,playing=true,previous=performance.now(),color=[.55,.13,.9];const balls=new Float32Array(112);
play.onclick=()=>{playing=!playing;play.textContent=playing?'Pausar':'Reproduzir'};
document.querySelector('#reset').onclick=()=>{time=0;playing=true;play.textContent='Pausar'};
timeInput.oninput=()=>{time=+timeInput.value;playing=false;play.textContent='Reproduzir'};
document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color.split(',').map(Number)});
function draw(now){const dt=Math.min((now-previous)/1000,.05);previous=now;if(playing){time+=dt*+speed.value;if(time>2.8)time=0}
canvas.width=Math.round(Math.min(canvas.clientWidth,560));canvas.height=Math.round(canvas.clientHeight);gl.viewport(0,0,canvas.width,canvas.height);
for(let b=0;b<28;b++){const row=Math.floor(b/4),col=b%4,age=Math.max(0,time-(6-row)*.065*+viscosity.value);const vx=(col-1.5)*(.12+row*.022),vy=.15+row*.13+Math.sin(b*2.7)*.12;
balls[b*4]=(col-1.5)*.19+Math.sin(row*2.4)*.045+vx*age+Math.sin(age*4+b)*.035*age;
balls[b*4+1]=.7-row*.125-vy*age-2.8*age*age;balls[b*4+2]=.19+.035*(.5+.5*Math.sin(b*1.7));balls[b*4+3]=1;}
gl.uniform4fv(locBalls,balls);gl.uniform3fv(locInk,color);gl.uniform1f(locAspect,canvas.width/canvas.height);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
timeInput.value=time;document.querySelector('#stamp').textContent=time.toFixed(2)+' s';requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
