<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escaninho — prévia da animação</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2eadb;color:#543019;font:17px system-ui;display:grid;place-items:center;min-height:100vh}main{text-align:center;padding:24px;width:min(95vw,650px)}h1{font-size:26px;margin:0}p{font-size:15px}#stage{position:relative;width:min(80vw,470px);aspect-ratio:1;margin:28px auto 14px}.base{width:100%;height:100%;position:absolute;inset:0}.letter{position:absolute;width:34%;height:34%;object-fit:contain;z-index:2;transform:rotate(var(--tilt));pointer-events:none}.counter{position:absolute;top:80.3%;left:34%;width:31%;font-weight:750;font-size:clamp(18px,5vw,32px);z-index:3}.goal{position:absolute;right:-4%;top:-8%;padding:8px 12px;border-radius:16px;background:#fff8e8;border:2px solid #d5b379;font-weight:bold;z-index:5}button{border:0;border-radius:12px;padding:14px 18px;background:#704323;color:white;font:600 15px system-ui;margin:5px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.secondary{background:#d8c4a3;color:#543019}small{display:block;margin:16px auto;max-width:430px;line-height:1.5}
</style>
<main><h1>Escaninho · 2×2</h1><p>A carta faz uma pirueta e voa até a meta. Após a última entrega, a madeira quebra.</p>
<div id="stage"><img class="base" src="../Assets/RoyalAves/Art/Obstacles/MailCubby/CM_escaninho_base_vazia.png"><div class="counter" id="counter">4</div><div class="goal" id="goal">Cartas: 0</div></div>
<button id="hit">Simular match adjacente</button><button class="secondary" id="play">Reproduzir sequência</button><button class="secondary" id="reset">Reiniciar</button>
<small>Prévia da animação. O botão simula um impacto válido; a conexão com os matches do tabuleiro ainda será integrada.</small></main>
<script>
const stage=document.querySelector('#stage'),hit=document.querySelector('#hit'),play=document.querySelector('#play');
let remaining=4,collected=0,busy=false,generation=0;
function reset(){generation++;stage.getAnimations({subtree:true}).forEach(a=>a.cancel());stage.querySelectorAll('.letter,.wake,.fragment').forEach(e=>e.remove());stage.querySelector('.base').style.visibility='visible';document.querySelector('#counter').style.visibility='visible';remaining=4;collected=0;busy=false;document.querySelector('#counter').textContent=4;document.querySelector('#goal').textContent='Entregas: 0';[[16,9,4],[52,9,-4],[16,44,4],[52,44,-4]].forEach(([x,y,tilt],i)=>{let e=document.createElement('img');e.className='letter';e.id='letter'+i;e.src='../Assets/RoyalAves/Art/Obstacles/MailCubby/CM_escaninho_carta_cartoon_v2.png';e.style.left=x+'%';e.style.top=y+'%';e.style.setProperty('--tilt',tilt+'deg');stage.append(e)});controls()}
function spin(t){let p=Math.max(0,Math.min(1,(t-.08)/.60));return p*p*(3-2*p)}
function controls(){hit.disabled=busy||remaining===0;play.disabled=busy}
async function emit(){if(busy||!remaining)return;busy=true;let token=generation,e=document.querySelector('#letter'+(remaining-1));remaining--;document.querySelector('#counter').textContent=remaining;controls();const rect=stage.getBoundingClientRect(),sx=parseFloat(e.style.left)*rect.width/100,sy=parseFloat(e.style.top)*rect.height/100,ex=document.querySelector('#goal').getBoundingClientRect().left-rect.left-rect.width*.10,ey=document.querySelector('#goal').getBoundingClientRect().top-rect.top-rect.height*.17;stage.querySelector('.base').animate([{transform:'scale(1)'},{transform:'scale(1.025,.975)'},{transform:'scale(1)'}],{duration:180});let start=performance.now(),lastWake=0;await new Promise(resolve=>{function frame(now){if(token!==generation){resolve();return}let t=Math.min(1,(now-start)/950),u=t*t,v=1-u,x=v*v*v*sx+3*v*v*u*sx+3*v*u*u*(sx+(ex-sx)*.55)+u*u*u*ex,y=v*v*v*sy+3*v*v*u*(sy-rect.height*.14)+3*v*u*u*(ey-rect.height*.15)+u*u*u*ey;e.style.transform=`translate(${x-sx}px,${y-sy}px) rotate(${8-26*u-360*spin(t)}deg) scale(${1+Math.sin(t*Math.PI)*.1})`;if(now-lastWake>22){lastWake=now;let w=document.createElement('i');w.className='wake';w.style.cssText=`position:absolute;left:${x+rect.width*.17}px;top:${y+rect.height*.20}px;width:9px;height:5px;border-radius:50%;background:#ffe7a0;box-shadow:0 0 7px #ffd264;z-index:1;pointer-events:none`;stage.append(w);w.animate([{opacity:.8,transform:'scale(1)'},{opacity:0,transform:'scale(.2)'}],{duration:240}).finished.then(()=>w.remove(),()=>w.remove())}if(t<1)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)});if(token!==generation)return;e.remove();collected++;document.querySelector('#goal').textContent='Entregas: '+collected;if(!remaining)await breakCabinet(token);if(token!==generation)return;busy=false;controls()}
async function breakCabinet(token){stage.querySelector('.base').style.visibility='hidden';document.querySelector('#counter').style.visibility='hidden';let animations=[];for(let row=0;row<3;row++)for(let col=0;col<4;col++){let f=document.createElement('div');f.className='fragment';f.style.cssText=`position:absolute;inset:0;background:url('../Assets/RoyalAves/Art/Obstacles/MailCubby/CM_escaninho_base_vazia.png') center/100% 100%;clip-path:polygon(${col*25}% ${row*100/3}%,${(col+1)*25}% ${row*100/3}%,${(col+1)*25}% ${(row+1)*100/3}%,${col*25}% ${(row+1)*100/3}%);transform-origin:${(col+.5)*25}% ${(row+.5)*100/3}%;pointer-events:none`;stage.append(f);let x=(col-1.5)*35,y=(row-1)*25+55,spin=((row+col)%2?1:-1)*55;animations.push(f.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${x}px,${y}px) rotate(${spin}deg)`,opacity:0}],{duration:620,easing:'ease-out',fill:'forwards'}).finished.then(()=>f.remove(),()=>f.remove()))}await Promise.all(animations)}
hit.onclick=emit;document.querySelector('#reset').onclick=reset;play.onclick=async()=>{reset();let token=generation;for(let i=0;i<4;i++){if(token!==generation)return;await emit();await new Promise(r=>setTimeout(r,400))}};reset();
</script></html>
